name: Project 1 - Basic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r project-1-basic-ci/requirements.txt

      - name: Run tests
        run: pytest project-1-basic-ci/test_app.py

      - name: Create artifact
        run: |
          mkdir -p artifact
          cp project-1-basic-ci/app.py artifact/
          cp project-1-basic-ci/test_app.py artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: project1-artifact
          path: artifact/
